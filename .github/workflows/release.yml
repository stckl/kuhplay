# Baut die Pakete aller Plattformen. Von Hand gestartet entstehen nur Artefakte,
# ein Tag v* erzeugt zusätzlich einen Release-ENTWURF. Veröffentlicht wird immer von Hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Bauen (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh

      - name: Bauen (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-mac.sh

      - name: Bauen (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: kuhplay-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip

  draft:
    name: Release-Entwurf
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true

      - name: Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" pakete/* --draft --verify-tag --generate-notes --title "KuhPlay $TAG"
