# Prüft jeden Push auf main und jeden Pull Request auf allen drei Plattformen.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build \
            libasound2-dev libgtk-3-dev libnss3 libgbm1 ffmpeg

      - name: Abhängigkeiten (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg ninja

      - name: Abhängigkeiten (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg ninja --no-progress -y

      - name: Formatierung
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --features cef,decklink -- -D warnings

      # HTML5-Renderer samt CEF-Runtime nach target/debug/cef – damit läuft
      # tests/cef_renderer.rs mit echtem CEF statt SKIP.
      - name: CEF-Renderer bündeln
        shell: bash
        run: |
          cargo build --locked --features cef,decklink --bin kuhplay-cef --bin kuhplay-cef-bundle
          target/debug/kuhplay-cef-bundle

      - name: Tests
        run: cargo test --locked --no-fail-fast --features cef,decklink

  companion:
    name: Companion-Modul
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Modul bauen
        working-directory: companion/kuhplay
        run: |
          npm ci --no-audit --no-fund
          npm run build
