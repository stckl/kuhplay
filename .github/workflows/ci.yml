# Prüft jeden Push auf main und jeden Pull Request auf allen drei Plattformen.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev ffmpeg

      - name: Abhängigkeiten (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Abhängigkeiten (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Formatierung
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --features webview,decklink -- -D warnings

      - name: Tests
        run: cargo test --locked --no-fail-fast --features webview,decklink
