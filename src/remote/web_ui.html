<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KuhPlay Remote</title>
<style>
/* Farben und Abstände wie in der App: docs/UI.md §3 und src/gui/theme.rs */
:root {
  color-scheme: dark;
  --bg: #121215; --list: #161619; --stripe: #1b1b1f; --panel: #212126; --raised: #2d2d34; --border: #34343c;
  --text: #dedee4; --dim: #9696a0; --faint: #5c5c66;
  --go: #2ecc71; --prewait: #ff9100; --paused: #3498db; --postwait: #27ae96; --error: #eb5a48; --panic: #e85f46;
  --accent: #ffb000; --selection: #3a5470; --cursor: #323640; --showbg: #3a1612;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--raised); border: 0; border-radius: 5px; padding: 4px 8px; cursor: pointer; }
button:hover:not(:disabled) { background: #3a3a44; }
button:disabled { color: var(--faint); cursor: default; }
input, select, textarea { background: var(--bg); border: 1px solid transparent; border-radius: 5px; padding: 3px 6px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--selection); }
input[type=checkbox] { accent-color: var(--selection); width: 15px; height: 15px; vertical-align: middle; }
input[type=range] { padding: 0; accent-color: #8a8a96; }
textarea { width: 100%; resize: vertical; }
#app { display: grid; height: 100dvh; grid-template: "mast mast mast" auto "tool list side" 1fr "insp insp insp" minmax(0, 38%) "foot foot foot" auto / 136px minmax(0, 1fr) 240px; }
#mast { grid-area: mast; display: flex; gap: 16px; align-items: center; padding: 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
body.show #mast { background: var(--showbg); outline: 2px solid var(--panic); outline-offset: -2px; }
#go { width: 132px; height: 64px; font-size: 30px; font-weight: 700; color: #fff; border: 3px solid var(--go); border-radius: 8px; flex: none; }
#go.idle { border: 1px solid #707684; }
#standby { flex: 1; min-width: 0; }
.label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .02em; }
#sname { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sname.none { color: var(--faint); font-weight: 400; }
#snotes { width: 100%; margin-top: 2px; }
#transport { display: flex; gap: 4px; align-items: center; flex: none; }
#transport .ico { width: 36px; height: 36px; background: none; font-size: 16px; }
#transport .ico:hover { background: var(--raised); }
#panic { height: 40px; width: 96px; border: 2px solid var(--panic); border-radius: 8px; font-size: 15px; margin-left: 4px; }
#tool { grid-area: tool; background: var(--panel); padding: 8px 4px; overflow: auto; border-right: 1px solid var(--border); }
#tool .label { padding: 12px 4px 2px; }
#tool .label:first-child { padding-top: 0; }
.row-btn { display: block; width: 100%; text-align: left; background: none; padding: 4px 8px; height: 26px; }
#list { grid-area: list; background: var(--list); display: flex; flex-direction: column; min-height: 0; }
#actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--panel); }
#cues { flex: 1; overflow: auto; min-height: 0; }
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: 0; z-index: 1; background: var(--list); text-align: left; font-size: 11px; font-weight: 400; color: var(--dim); padding: 5px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 0 6px; height: 28px; white-space: nowrap; }
tbody tr:nth-child(even) { background: var(--stripe); }
tr.cursor { background: var(--cursor) !important; }
tr.sel { background: var(--selection) !important; }
tr.disarmed td { color: var(--faint); }
td.time { font-family: ui-monospace, Menlo, monospace; font-size: 13px; text-align: right; position: relative; }
td.zero { color: var(--faint); } tr.sel td.zero { color: var(--dim); }
td.num { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
td.target { color: var(--dim); max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
td.name { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
td.stat { width: 44px; font-size: 13px; cursor: pointer; }
.bar { position: absolute; inset: 0 auto 0 0; background: rgba(46, 204, 113, .18); pointer-events: none; }
.t-play { color: var(--go); } .t-pre { color: var(--prewait); } .t-pause { color: var(--paused); } .t-post { color: var(--postwait); } .t-err { color: var(--error); }
.caret { background: none; padding: 0 3px; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--border); padding: 8px 12px; overflow: auto; }
.tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--border); margin-bottom: 8px; overflow-x: auto; flex: none; }
.tabs button { background: none; padding: 2px 0 4px; color: var(--dim); border-radius: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); font-weight: 600; border-color: var(--text); }
.cart { display: flex; justify-content: space-between; width: 100%; background: none; height: 26px; }
.cart.on { background: var(--selection); }
.cart span:last-child { color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
.link { background: none; color: var(--dim); margin-top: 8px; }
.active { position: relative; background: var(--raised); border-radius: 5px; border-left: 3px solid var(--go); margin-bottom: 4px; padding: 4px; display: flex; gap: 4px; align-items: center; overflow: hidden; }
.active.paused { border-color: var(--paused); }
.active > * { position: relative; }
.active .info { flex: 1; min-width: 0; }
.active .info div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.active .remain { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); }
.active button { width: 28px; height: 28px; background: none; flex: none; }
.empty { color: var(--faint); text-align: center; padding: 16px; }
#insp { grid-area: insp; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; flex-direction: column; min-height: 0; }
#ihead { font-size: 15px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ibody { flex: 1; overflow: auto; min-height: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 24px; }
.form { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.form > label, .form > .lab { text-align: right; color: var(--dim); }
.form .wide { grid-column: 1 / -1; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.inline input[type=text]:not(.short), .form > input[type=text], .form > select, .form > textarea { width: 100%; }
.inline input.grow { flex: 1; width: auto; }
input.short { width: 88px; }
.swatch { width: 18px; height: 18px; padding: 0; border-radius: 5px; }
.swatch.on { outline: 2px solid var(--text); }
.ok { color: var(--go); } .bad { color: var(--error); } .dim { color: var(--dim); }
.matrix { border-collapse: separate; border-spacing: 2px; width: auto; }
.matrix td, .matrix th { height: auto; padding: 0; text-align: center; position: static; background: none; border: 0; }
.matrix td:first-child { text-align: left; color: var(--dim); padding-right: 6px; }
#foot { grid-area: foot; display: flex; gap: 8px; align-items: center; background: var(--panel); border-top: 1px solid var(--border); padding: 2px 8px; min-height: 28px; flex-wrap: wrap; }
body.show #foot { background: var(--showbg); }
.seg.on { background: var(--selection); }
.seg { background: none; padding: 1px 8px; }
#broken { background: none; color: var(--error); padding: 1px 4px; }
#msg { color: var(--error); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#conn { color: var(--dim); font-size: 11px; }
#conn.off { color: var(--error); font-weight: 600; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 5; }
#modal.open { display: flex; }
#dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; width: min(860px, 100%); max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
#dtitle { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 15px; border-bottom: 1px solid var(--border); }
#dmain { display: grid; grid-template-columns: 136px minmax(0, 1fr); min-height: 0; overflow: hidden; flex: 1; }
#dnav { padding: 8px; border-right: 1px solid var(--border); overflow: auto; }
#dnav button.on { background: var(--selection); }
#dbody { padding: 12px 16px; overflow: auto; min-height: 320px; }
.section { margin: 16px 0 6px; } .section:first-child { margin-top: 0; }
.card { background: var(--raised); border-radius: 5px; padding: 8px; margin-bottom: 8px; }
.note { color: var(--dim); margin-top: 12px; }
@media (max-width: 800px) {
  body { overflow: auto; }
  #app { height: auto; grid-template: "mast" auto "foot" auto "list" 45dvh "tool" auto "insp" auto "side" auto / minmax(0, 1fr); }
  #mast { flex-wrap: wrap; position: sticky; top: 0; z-index: 3; }
  #go { width: 110px; } #standby { flex-basis: calc(100% - 130px); }
  #transport { width: 100%; justify-content: space-between; }
  #tool { display: flex; flex-wrap: wrap; border: 0; gap: 2px; } #tool .label { display: none; } #tool .row-btn { width: auto; background: var(--raised); }
  #insp { min-height: 50dvh; } #side { border: 0; border-top: 1px solid var(--border); }
  td, button { min-height: 32px; } .target-col, .wait-col { display: none; } td.name { min-width: 120px; }
  #dmain { grid-template-columns: minmax(0, 1fr); overflow: auto; } #dnav { display: flex; flex-wrap: wrap; border: 0; border-bottom: 1px solid var(--border); } #dnav .row-btn { width: auto; }
  #dbody { overflow: visible; }
}
</style>
</head>
<body>
<div id="app">
  <div id="mast">
    <button id="go" title="Space">GO</button>
    <div id="standby"><div class="label">Standby</div><div id="sname"></div><input id="snotes" type="text" placeholder="Notes (standby cue)…"></div>
    <div id="transport">
      <button class="ico" id="pause" title="Pause All">❚❚</button>
      <button class="ico" id="resume" title="Resume All">▶</button>
      <button class="ico" id="reset" title="Reset All">↺</button>
      <button id="panic" title="Esc">Panic</button>
    </div>
  </div>
  <div id="tool"></div>
  <div id="list"><div id="actions"></div><div id="cues"></div></div>
  <div id="side"></div>
  <div id="insp"></div>
  <div id="foot"></div>
</div>
<div id="modal"><div id="dialog"><div id="dtitle"><span>Workspace Settings</span><button id="dclose">Close</button></div><div id="dmain"><div id="dnav"></div><div id="dbody"></div></div></div></div>
<script>
'use strict';
let S = null, W = null, ws = null, statusAt = 0;
let selected = [], sideTab = 'lists', inspTab = 'Basics', page = 'General', message = '';
const $ = id => document.getElementById(id);
const COLORS = [[231,76,60],[230,126,34],[241,196,15],[39,174,96],[41,128,185],[142,68,173],[232,67,147],[127,140,141]];
const TOOLS = [['Media',['Audio','Video','Html','SlideShow']],['Fade',['Fade']],['Control',['Group','Stop','Script','Control']],['Data',['HtmlData']]];
const TABS = { Audio:['Basics','Triggers','Time & Loops','Audio Levels'], Video:['Basics','Triggers','Time & Loops','Geometry','Audio Levels'], Fade:['Basics','Triggers','Curve'], Html:['Basics','Triggers','Geometry','Source'], SlideShow:['Basics','Triggers','Geometry','Slides'], HtmlData:['Basics','Triggers','Data'] };
const ICON = { Audio:'♪', Video:'▣', Html:'◍', SlideShow:'▤', Fade:'◐', Group:'❏', Stop:'■', Script:'✎', Control:'⌃', HtmlData:'{}' };

function send(action, extra = {}) {
  const c = { action, ...extra };
  if (ws && ws.readyState === 1) { ws.send(JSON.stringify(c)); return; }
  fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c) })
    .then(r => { if (!r.ok) setMessage('Command failed.'); }).catch(() => setMessage('No connection to KuhPlay.'));
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => renderFoot();
  ws.onclose = () => { renderFoot(); setTimeout(connect, 2000); };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'status') {
      const modeChanged = S && S.show_mode !== ev.show_mode;
      S = ev; statusAt = performance.now(); renderLive();
      if (modeChanged) render();
    }
    else if (ev.type === 'workspace') { W = ev; render(); }
    else if (ev.type === 'error') setMessage(ev.message);
  };
}
function setMessage(text) { message = text; renderFoot(); }
const editable = () => !(S && S.show_mode);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid);
  return el;
}
function fmt(ms) {
  const t = Math.max(0, Math.round(ms)), m = Math.floor(t / 60000), s = Math.floor(t / 1000) % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(t % 1000).padStart(3, '0');
}
function parseTime(text) {
  const parts = text.trim().split(':').map(Number);
  if (!parts.length || parts.some(Number.isNaN)) return null;
  return Math.round(parts.reduce((sum, p) => sum * 60 + p, 0) * 1000);
}
const allCues = () => W ? W.cues.flatMap(c => [c, ...c.children]) : [];
const cueById = id => allCues().find(c => c.id === id);
const primary = () => cueById(selected[0]);
function statusMark(c) {
  const running = { Playing:['▶','t-play'], Paused:['❚❚','t-pause'], PreWait:['◷','t-pre'], PostWait:['◷','t-post'], Error:['✕','t-err'] }[c.status];
  return running || null;
}

function render() {
  if (!W) return;
  document.title = W.show_name + ' – KuhPlay Remote';
  renderTool(); renderActions(); renderCues(); renderSide(); renderInsp(); renderFoot(); renderMast();
  if ($('modal').classList.contains('open')) renderSettings();
}
function renderLive() { renderMast(); renderFoot(); renderCues(); if (sideTab === 'active' || !W) renderSide(); document.body.classList.toggle('show', !!(S && S.show_mode)); }

function renderMast() {
  const c = S && S.standby, name = $('sname'), notes = $('snotes'), full = c && cueById(c.id);
  name.textContent = c ? c.number + ' • ' + c.name : 'No cue standing by';
  name.className = c ? '' : 'none';
  $('go').className = c ? '' : 'idle';
  notes.style.display = editable() ? '' : 'none';
  notes.disabled = !full;
  if (document.activeElement !== notes) notes.value = full ? full.notes : '';
}
function renderTool() {
  const on = editable();
  $('tool').replaceChildren(...TOOLS.flatMap(([group, types]) => [
    h('div', { class: 'label' }, group),
    ...types.map(t => h('button', { class: 'row-btn', disabled: !on, onclick: () => send('new_cue', { cue_type: t }) },
      (ICON[t] || '') + '  ' + (W.options.cue_type.find(o => o.value === t) || { label: t }).label)),
  ]));
}
function renderActions() {
  const on = editable(), c = primary(), any = selected.length > 0;
  const armedNow = c ? c.is_armed : true;
  $('actions').replaceChildren(
    h('button', { disabled: !on || !any, onclick: () => send('duplicate_cues', { ids: selected }) }, 'Duplicate'),
    h('button', { disabled: !on || !any, onclick: () => send('group_cues', { ids: selected }) }, 'Group'),
    h('button', { disabled: !on || !c, onclick: () => selected.forEach(id => send('update_cue', { id, changes: { is_armed: !armedNow } })) }, armedNow ? 'Disarm' : 'Arm'),
    h('button', { disabled: !on || !c, onclick: () => moveSelected(-1) }, 'Move Up'),
    h('button', { disabled: !on || !c, onclick: () => moveSelected(1) }, 'Move Down'),
    h('button', { disabled: !c, onclick: () => send('set_playhead', { id: c.id }) }, 'Set Playhead'),
    h('button', { disabled: !c, onclick: () => send('go_to', { cue: c.number }) }, 'Play Cue'),
    h('button', { disabled: !on || !any, onclick: () => {
      if (confirm(selected.length + ' cue(s) delete?')) { selected.forEach(id => send('delete_cue', { id })); selected = []; }
    } }, 'Delete'),
  );
}
function moveSelected(delta) {
  const index = W.cues.findIndex(c => c.id === selected[0]);
  if (index < 0) return setMessage('Only top-level cues can be moved.');
  send('move_cue', { id: selected[0], to: Math.max(0, Math.min(W.cues.length - 1, index + delta)) });
}
function pick(e, id) {
  if (e.metaKey || e.ctrlKey) selected = selected.includes(id) ? selected.filter(x => x !== id) : [...selected, id];
  else selected = [id];
  render();
}
function runningInfo(id) {
  const r = S && S.running.find(x => x.id === id);
  if (!r) return null;
  const elapsed = r.elapsed_ms + (r.status === 'Playing' ? performance.now() - statusAt : 0);
  return { ...r, elapsed };
}
function timeCell(ms, c, field) {
  const wait = field === 'duration' ? '' : ' wait-col';
  const td = h('td', { class: 'time' + wait + (ms === 0 ? ' zero' : '') });
  const run = field === 'duration' ? runningInfo(c.id) : null;
  if (run && ms > 0) {
    td.className = 'time' + wait + ' ' + (run.status === 'Paused' ? 't-pause' : 't-play');
    td.append(h('span', { class: 'bar', style: 'width:' + Math.min(100, run.elapsed / ms * 100) + '%' }), fmt(ms - run.elapsed));
  } else td.append(fmt(ms));
  td.addEventListener('dblclick', () => { if (editable()) editTime(td, c, field, ms); });
  return td;
}
let editing = false;
function editTime(td, c, field, ms) {
  editing = true;
  const input = h('input', { type: 'text', class: 'short', value: fmt(ms) });
  const done = commit => {
    editing = false;
    const value = commit ? parseTime(input.value) : null;
    if (value !== null) send('update_cue', { id: c.id, changes: { [field]: value } });
    renderCues();
  };
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.dataset.cancel = '1'; input.blur(); } });
  input.addEventListener('blur', () => done(!input.dataset.cancel));
  td.replaceChildren(input); input.focus(); input.select();
}
function editText(td, c, field) {
  if (!editable()) return;
  editing = true;
  const input = h('input', { type: 'text', value: c[field], style: 'width:100%' });
  const done = commit => {
    editing = false;
    if (commit && input.value !== c[field]) send('update_cue', { id: c.id, changes: { [field]: input.value } });
    renderCues();
  };
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.dataset.cancel = '1'; input.blur(); } });
  input.addEventListener('blur', () => done(!input.dataset.cancel));
  td.replaceChildren(input); input.focus(); input.select();
}
function targetText(c) {
  if (c.cue_type === 'Audio' || c.cue_type === 'Video') return c.target_path ? c.target_path.split('/').pop() : '–';
  if (c.cue_type === 'Control') return c.control_target ? 'Q ' + c.control_target : 'all cues';
  if (c.cue_type === 'Html') return 'HTML';
  if (c.cue_type === 'HtmlData') return 'JSON';
  if (c.cue_type === 'SlideShow') return c.slideshow ? c.slideshow.slides.length + ' slides' : '–';
  return '–';
}
function cueRow(c, index, child) {
  const isCursor = !child && S && S.playhead === index;
  const row = h('tr', { class: [isCursor ? 'cursor' : '', selected.includes(c.id) ? 'sel' : '', c.is_armed ? '' : 'disarmed'].join(' '), onclick: e => pick(e, c.id) });
  const mark = statusMark(c), broken = W.problems[c.id];
  const stat = h('td', { class: 'stat', title: 'Click to set the playhead', onclick: e => { if (!child) { e.stopPropagation(); send('set_playhead', { id: c.id }); } } });
  if (isCursor) stat.append('› ');
  if (mark) stat.append(h('span', { class: mark[1] }, mark[0] + ' '));
  if (broken) stat.append(h('span', { class: 't-err', title: broken.join('; ') }, '✕'));
  const type = h('td', { title: c.cue_type });
  if (c.cue_type === 'Group' && !child) type.append(h('button', { class: 'caret', onclick: e => { e.stopPropagation(); send('update_cue', { id: c.id, changes: { collapsed: !c.collapsed } }); } }, c.collapsed ? '▸' : '▾'));
  type.append(ICON[c.cue_type] || '');
  const num = h('td', { class: 'num', ondblclick: () => editText(num, c, 'number') }, c.number);
  const name = h('td', { class: 'name', ondblclick: () => editText(name, c, 'name'), style: (child ? 'padding-left:26px;' : '') + (c.color ? `box-shadow: inset 3px 0 rgb(${c.color})` : '') }, c.name);
  const cont = h('td', { title: c.continue_mode }, c.continue_mode === 'Off' ? '' : h('span', { style: 'color:var(--accent)' }, '»'));
  row.append(stat, type, num, name, h('td', { class: 'target target-col' }, targetText(c)), timeCell(c.pre_wait, c, 'pre_wait'), timeCell(c.duration, c, 'duration'), timeCell(c.post_wait, c, 'post_wait'), cont);
  if (!child && editable()) {
    row.draggable = true;
    row.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', c.id));
    row.addEventListener('dragover', e => e.preventDefault());
    row.addEventListener('drop', e => { e.preventDefault(); send('move_cue', { id: e.dataTransfer.getData('text/plain'), to: index }); });
  }
  return row;
}
function renderCues() {
  if (!W || editing) return;
  const scroll = $('cues').scrollTop, body = h('tbody');
  W.cues.forEach((c, i) => {
    body.append(cueRow(c, i, false));

  const running = S && S.running.length > 0, form = h('div', { class: 'form' },
    field('Output', h('div', { class: 'inline' }, Object.assign(select(options, W.audio_output, v => send('set_audio_output', { device: v })), { disabled: running }), h('button', { onclick: () => send('refresh_audio_devices') }, 'Refresh'))),
    field('Format', h('span', {}, info ? info.channels + ' channels, ' + info.sample_rate + ' Hz' : 'Unknown')));
  if (running) form.append(h('div', { class: 'wide dim' }, 'Stop all cues to change the device.'));
  const patch = W.audio_patch, change = (i, values) => send('set_audio_patch', { patch: { channels: patch.channels.map((c, j) => j === i ? { ...c, ...values } : c) } });
  const outputs = [{ value: 0, label: 'Off' }]; for (let o = 1; o <= Math.max(maxOutput, 1); o++) outputs.push({ value: o, label: 'Output ' + o });
  const rows = h('div', { class: 'form' }, patch.channels.flatMap((c, i) => {
    const opts = c.output > maxOutput ? [...outputs, { value: c.output, label: 'Output ' + c.output + ' (not on device)' }] : outputs;
    return field('Ch ' + (i + 1), h('div', { class: 'inline' }, text(c.name, v => change(i, { name: v }), { class: 'grow' }), select(opts, c.output, v => change(i, { output: v }))));
  }));
  return [form, h('div', { class: 'label section' }, 'Channels'), rows, h('p', { class: 'note' }, 'Device, channel names and outputs are saved with the show.')];
}
function pageVideo() {
  const modes = [['off', 'Off'], ['preview', 'Preview Windows'], ['displays', 'Displays']];
  const top = h('div', { class: 'form' }, field('Output', h('div', { class: 'inline' }, modes.map(([m, label]) => h('button', { class: 'seg' + (W.output_mode === m ? ' on' : ''), onclick: () => send('set_output_mode', { mode: m }) }, label)))));
  const displays = W.displays.map(d => h('div', { class: 'dim' }, `${d.name}: ${d.width}×${d.height} at ${d.x}, ${d.y}`));
  const screens = W.screens.map(s => {
    const set = changes => send('update_screen', { id: s.id, changes });
    return h('div', { class: 'card' }, h('div', { class: 'form' },
      field('Name', text(s.name, v => set({ name: v }))),
      field('Position', h('div', { class: 'inline' }, 'X', number(s.x, v => set({ x: Math.round(v) })), 'Y', number(s.y, v => set({ y: Math.round(v) })))),
      field('Size', h('div', { class: 'inline' }, 'W', number(s.width, v => set({ width: Math.max(1, Math.round(v)) })), 'H', number(s.height, v => set({ height: Math.max(1, Math.round(v)) })))),
      field('Rotation', select(W.options.rotation, s.rotation, v => set({ rotation: v }))),
      field('Test Pattern', h('div', { class: 'inline' }, check(s.test_pattern, 'Show', v => set({ test_pattern: v })), select(W.options.test_pattern_kind, s.test_pattern_kind, v => set({ test_pattern_kind: v })), s.test_pattern_kind === 'LedWall' ? number(s.checker_size, v => set({ checker_size: Math.max(8, Math.round(v)) })) : null)),
      h('div', { class: 'wide' }, h('button', { onclick: () => { if (confirm('Delete screen ' + s.name + '?')) send('remove_screen', { id: s.id }); } }, 'Delete Screen'))));
  });
  const screenOptions = [{ value: null, label: 'None' }, ...W.screens.map(s => ({ value: s.id, label: s.name }))];
  const stages = W.stages.map(s => h('div', { class: 'form' }, field(s.name, select(screenOptions, s.screen, v => send('update_stage', { name: s.name, changes: { screen: v } })))));
  return [top, h('div', { class: 'label section' }, 'Displays'), displays, h('p', { class: 'dim' }, 'Displays are arranged in the system settings of the KuhPlay computer.'),
    h('div', { class: 'label section' }, 'Screens'), screens, h('button', { onclick: () => send('add_screen', { name: 'Screen ' + (W.screens.length + 1) }) }, '+ Add Screen'),
    h('div', { class: 'label section' }, 'Stages'), stages, h('button', { onclick: () => send('add_stage', { name: 'Stage ' + (W.stages.length + 1) }) }, '+ Add Stage')];
}
function infoRows(rows, note) { return [h('div', { class: 'form' }, rows.flatMap(([k, v]) => field(k, h('span', {}, v)))), h('p', { class: 'note' }, note)]; }
function pageKeys() {
  let group = '';
  return [...W.shortcuts.flatMap(s => {
    const head = s.group !== group ? h('div', { class: 'label section' }, s.group) : null;
    group = s.group;
    return [head, h('div', { class: 'form' }, h('span', {}, s.label), h('span', { class: 'dim' }, s.keys))];
  }).filter(Boolean), h('p', { class: 'note' }, 'These shortcuts belong to the app. In this page: Space = GO, Esc = Panic.')];
}

// ------------------------------------------------------------------ Start
$('go').onclick = () => send('go');
$('panic').onclick = () => send('panic');
$('pause').onclick = () => send('pause_all');
$('resume').onclick = () => send('resume_all');
$('reset').onclick = () => send('reset');
$('dclose').onclick = () => $('modal').classList.remove('open');
$('snotes').onchange = e => { if (S && S.standby) send('update_cue', { id: S.standby.id, changes: { notes: e.target.value } }); };
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (e.code === 'Space') { e.preventDefault(); send('go'); }
  if (e.key === 'Escape') { if ($('modal').classList.contains('open')) $('modal').classList.remove('open'); else send('panic'); }
});
setInterval(() => { if (S && S.running.length) { renderCues(); if (sideTab === 'active') renderSide(); } }, 100);
connect();
</script>
