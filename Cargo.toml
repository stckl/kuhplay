[package]
build = "build.rs"
name = "kuhplay"
version = "0.1.2"
edition = "2021"
description = "Plattformübergreifende Show-Control- und Cue-Playback-Software in Rust"
license = "MIT"

[dependencies]
# GUI (plattformübergreifend, performant, Dark-Mode-freundlich)
eframe = "0.30"
egui = "0.30"
egui_extras = "0.30" # TableBuilder für die Cue-Liste

# Schrift der Testbilder: dieselbe, die egui mitbringt, in reinem Rust gerendert.
ab_glyph = "0.2"
epaint_default_fonts = "0.30"

# Concurrency: thread-sichere Kanäle zwischen UI- und Engine-Thread
crossbeam-channel = "0.5"

# Robuste Fehlerbehandlung
thiserror = "2"

# Serialisierung (Persistenz von Cue-Listen, IDs, JSON-Payloads der Data-Cues)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Async-Runtime (vorbereitet für zukünftige async Backends, z. B.
# wry-WebView-Events; der Engine-Loop selbst nutzt bewusst crossbeam +
# einen dedizierten Thread – siehe src/engine/mod.rs)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util"] }

# Web-Remote: HTTP + WebSocket Server (axum) für Browser-Fernsteuerung
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
# Companion Plugin: TCP JSON-lines Protokoll (nutzt tokio::net)
# OSC-Steuerung: UDP (rosc, pure Rust) – Netzwerk-Remote
rosc = "0.10"
# MIDI-Steuerung: Controller-Input (midir; macOS CoreMIDI, Linux ALSA)
midir = "0.11"

# Update-Funktion (Block U): Ed25519-Signaturprüfung des Release-Manifests
# (nie unsignierte Updates installieren) + SHA-256. HTTP läuft über das
# systemeigene `curl` (ab Win10 immer vorhanden) – bewusst keine TLS-Crate,
# damit der Windows-Cross-Check ohne C-Toolchain grün bleibt.
minisign-verify = "0.3"
sha2 = "0.10"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native Datei-Dialoge (Medien/Slides/HTML-Dateien im Inspector hinterlegen).
# macOS: Cocoa (keine System-Dependency); Linux: GTK3 (rfd-Default).
rfd = "0.15"

# Echtes Media-Playout (Real-Engine, siehe src/engine/real_engine.rs):
# Audio: symphonia-Dekodierung (pure Rust) + cpal-Ausgabe.
cpal = "0.18.2"
symphonia = { version = "0.5.4", features = ["mp3", "aac", "alac", "isomp4", "aiff", "caf"] }
# Video: ffmpeg-Subprocess (rawvideo/rgba) + Bild-Dekodierung (Diashows).
image = "0.25.10"
# Hardware-Displays (Screen-Zuordnung der Stages, „Stage → Screen“).
display-info = "0.5"

# HTML5-Renderer: CEF (Chromium Embedded Framework) mit Offscreen-Rendering
# als eigener Subprocess (src/bin/kuhplay-cef.rs) – wie OBS/CasparCG. Einziger
# Renderer; die Engine nutzt ihn, wenn das Binary auffindbar ist, sonst
# virtueller Fallback – siehe src/engine/webview_backend.rs.
cef = { version = "156", optional = true }
# Base64 für Frame-Payloads der Renderer-IPC (bereits transitiv im Tree).
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# Native Menüleiste (siehe src/gui/native_menu.rs).
muda = "0.17"
# Ausgabefenster exakt platzieren (siehe src/gui/macos_output.rs).
objc2-06 = { package = "objc2", version = "0.6" }
objc2-foundation-03 = { package = "objc2-foundation", version = "0.3", features = ["NSGeometry", "NSString"] }

# Zukünftige Media-Anbindung (noch nicht einkompiliert, bewusst commented):
# gstreamer = "0.23"       # Video/Audio, Hardware-Decoding (Decklink, NDI)
# gstreamer-app = "0.23"   # App-Sink/Source für Frame-Zugriff

[features]
default = ["cef"]
# Native DeckLink-Ausgabe direkt über das Blackmagic SDK 16.0
# (third_party/decklink-sdk-16.0, nur Include-Header eingecheckt). Ohne SDK
# oder ohne Feature läuft der Build normal durch.
decklink = []
# „cef": baut den CEF-Subprocess (kuhplay-cef) für HTML5-Cues mit
# Offscreen-Rendering wie OBS/CasparCG (docs/KONZEPT-html-templates.md §9).
# Default an; ohne Feature (z. B. Cross-Check ohne CEF-Download) bleibt der
# virtuelle Fallback in der Engine.
cef = ["dep:cef"]

[[bin]]
name = "kuhplay-cef"
path = "src/bin/kuhplay-cef.rs"
required-features = ["cef"]

# Windows: native DeckLink-COM-API (DeckLinkAPI64.dll, via regsvr32 registriert)
# für Hardware-Ausgabe ohne ffmpeg-decklink-Muxer (siehe src/engine/decklink_com.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-core = "0.62"

[build-dependencies]
cc = "1"

[dev-dependencies]
minisign = "0.10"

hound = "3.5.1"
# Test-Suite: echte Temp-Dateien für Resilienz-Tests
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
